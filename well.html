\n/* ===== 10X ULTRA VISUAL ENGINE ===== */
:root{--glow:#5ac0ff;--glow2:#40d972;--glowSoft:#5ac0ff44}

function list(src,kind,top){const cur=kind==='r'?'':'';return Object.entries(src).map(([n,e])=>{const ok=+n<=top+1;return row(sprite(e.name)+' '+n+'. '+e.name,'HP '+F(e.hp)+' · Dmg '+F(e.damage)+' · '+cur+' '+F(e.reward),btn(ok?'Fight':'',`fight('${kind}',${n})`,!ok))}).join('')}
function start(){const n=g('nm').value.trim();if(!n){g('nm').focus();return}P=fresh(n,g('cl').value);norm();save();view='menu';draw()}
const buy=n=>{const w=D.weapons[n];if(P.coins>=w.price){P.coins-=w.price;P.inv.push(n);SFX.buy();save();draw()}else SFX.error()};
function rickUp(k,cost,amt){if((P.rc||0)<cost){SFX.error();return}P.rc-=cost;if(k==='hp'){P.hp+=amt}else if(k==='dmg'){P.dmg+=amt}else{P.heal+=amt}SFX.buy();SFX.rick();save();draw()}
function rickBuyWpn(n,cost){if((P.rc||0)<cost||P.inv.includes(n)){SFX.error();return}P.rc-=cost;P.inv.push(n);SFX.buy();SFX.rick();save();draw()}

const wear=n=>{const a=D.armor[n];if(P.coins>=a.price){P.coins-=a.price;P.armor=n;SFX.equip();save();draw()}else SFX.error()};
const upg=k=>{const c=upCost(k);if(P.coins<c){SFX.error();return}P.coins-=c;P.lv[k]++;if(k=='hp')P.hp+=25;else P[k]+=5;SFX.buy();save();draw()};
function unlock(k){const [n,c,rq,e]=SK[k];if(P.sk.pts<c||P.sk.un.includes(k))return;P.sk.pts-=c;P.sk.un.push(k);
 if(e.hp)P.hp=Math.max(1,P.hp+e.hp);if(e.d)P.dmg+=e.d;if(e.h)P.heal+=e.h;if(e.ar)P.sk.ar+=e.ar;if(e.cr)P.sk.cr+=e.cr;if(e.m)P.sk.m*=e.m;SFX.unlock();save();draw()}
function claim(id){const x=P.q.list.find(y=>y.id==id);if(x&&!x.done&&x.p>=x.t){x.done=true;P.coins+=x.r;save();draw()}}
function setNG(){const el=g('nglv');const lv=Math.max(0,Math.min(999999,Math.floor(Number(el&&el.value)||0)));P.ng.lv=lv;P.ng.on=lv>0;save();SFX.unlock();draw()}
function deco(n){const d=DECOS[n];if(!d)return;if(!P.decorations.includes(n)){if(P.coins<d.price){SFX.error();return}P.coins-=d.price;P.decorations.push(n);SFX.buy()}P.decoration=n;save();draw()}
function skin(n){if(!P.themes.includes(n)){if(P.coins<TH[n][0])return;P.coins-=TH[n][0];P.themes.push(n)}P.theme=n;save();draw()}
function slot(i,w){if(w){localStorage.setItem('coolrpg_slot_'+i,JSON.stringify(P))}else{try{P=JSON.parse(localStorage.getItem('coolrpg_slot_'+i));norm();save()}catch(e){}}draw()}
function imp(){const t=prompt('Paste save code:');if(!t)return;try{const o=JSON.parse(t);if(o&&o.name&&o.cls&&D.classes[o.cls]){P=o;norm();save();draw()}}catch(e){alert('Invalid save code')}}
function saveLoad(){const n=prompt('Loadout name:');if(n){P.loads[n.slice(0,16)]={eq:P.eq,armor:P.armor,en:P.ench[P.eq]};save();draw()}}

/* ===== Multiplayer: 5-digit room code via PeerJS ===== */
let peer=null,dc=null,MP=null,isHost=false,mpCode='',mpStatus='';
const send=m=>{try{if(dc&&dc.open)dc.send(JSON.stringify(m))}catch(e){}};
function mpCleanup(){
  try{if(dc){dc.close()}}catch(e){}
  try{if(peer){peer.destroy()}}catch(e){}
  peer=dc=null;MP=null;mpCode='';mpStatus='';
}
function wireConn(conn){
  dc=conn;
  conn.on('open',()=>{
    mpStatus='Connected!';
    MP=MP||{hp:eff().hp,op:null,turn:isHost,over:false};
    send({t:'hi',n:P.name,c:P.cls,e:eff()});
    SFX.win();
  });
  conn.on('data',d=>{
    try{onMsg(typeof d==='string'?JSON.parse(d):d)}catch(e){}
  });
  conn.on('close',()=>{
    if(MP&&!MP.over){MP.over=true;SFX.lose();alert('Your friend disconnected.');go('mp')}
  });
  conn.on('error',err=>{mpStatus='Connection error';draw()});
}
function mpHost(){
  if(typeof Peer==='undefined'){alert('PeerJS failed to load. Check your internet connection.');return}
  mpCleanup();
  isHost=true;
  mpCode=String(Math.floor(10000+Math.random()*90000));
  mpStatus='Creating room '+mpCode+'…';
  view='mphost';draw();SFX.ui();
  try{
    peer=new Peer('coolrpg-'+mpCode,{debug:0});
    peer.on('open',id=>{mpStatus='Room ready — share code '+mpCode;draw();SFX.click()});
    peer.on('connection',conn=>{wireConn(conn);mpStatus='Friend joining…';draw()});
    peer.on('error',err=>{
      // ID taken → new code
      if(String(err).includes('taken')|| (err&&err.type==='unavailable-id')){
        mpCode=String(Math.floor(10000+Math.random()*90000));
        peer.destroy();
        peer=new Peer('coolrpg-'+mpCode,{debug:0});
        peer.on('open',()=>{mpStatus='Room ready — share code '+mpCode;draw()});
        peer.on('connection',conn=>wireConn(conn));
      } else {
        mpStatus='Could not host: '+(err&&err.message?err.message:err);
        draw();
      }
    });
  }catch(e){mpStatus='Host failed: '+e.message;draw()}
}
function mpJoinCode(){
  if(typeof Peer==='undefined'){alert('PeerJS failed to load. Check your internet connection.');return}
  const el=g('jcode');
  let code=(el&&el.value||'').replace(/\D/g,'').slice(0,5);
  if(code.length!==5){alert('Enter the 5-digit room code from your friend.');return}
  mpCleanup();
  isHost=false;mpCode=code;mpStatus='Connecting to '+code+'…';view='mpjoin';draw();SFX.ui();
  try{
    peer=new Peer({debug:0});
    peer.on('open',()=>{
      const conn=peer.connect('coolrpg-'+code,{reliable:true});
      wireConn(conn);
      mpStatus='Waiting for host…';
      draw();
    });
    peer.on('error',err=>{mpStatus='Join failed: '+(err&&err.message?err.message:err);draw();SFX.lose()});
  }catch(e){mpStatus='Join failed: '+e.message;draw()}
}
function onMsg(m){
  MP=MP||{hp:eff().hp,op:null,turn:isHost,over:false};
  if(m.t=='hi'){
    MP.op={name:m.n,cls:m.c,hp:m.e.hp,max:m.e.hp};
    // exchange stats both ways
    if(!isHost) send({t:'hi',n:P.name,c:P.cls,e:eff()});
    view='mpbattle';lock=false;draw();SFX.win();
  } else if(m.t=='a'){
    MP.hp=Math.max(0,MP.hp-m.d);
    fx('es','lu');
    setTimeout(()=>{fx('ps','hit');pop('ps',(m.c?' ':'-')+F(m.d),m.c?'crit':'dmg');if(m.c)fx('ar','shake');SFX.hit();if(m.c)SFX.crit()},150);
    MP.turn=true;mpUpd();
    if(MP.hp<=0)mpEnd(false);
  } else if(m.t=='h'){
    MP.op.hp=Math.min(MP.op.max,MP.op.hp+m.h);
    fx('es','glow');pop('es','+'+F(m.h),'heal');SFX.heal();
    MP.turn=true;mpUpd();
  } else if(m.t==='modeReq'&&isHost){startMPMode(m.mode)} else if(m.t==='coopStart'){MP.mode=m.mode;MP.coop=true;MP.enemy={...m.e};MP.aHp=m.aHp;MP.bHp=m.bHp;MP.turn=m.turn;view='mpcoop';lock=false;draw();mpCoopUpd();SFX.unlock()} else if(m.t==='coopAct'){
    MP.enemy.hp=Math.max(0,MP.enemy.hp-(m.d||0));
    if(m.h){if(m.from==='a')MP.aHp=Math.min(eff().hp,MP.aHp+m.h);else MP.bHp=Math.min(MP.op.max,MP.bHp+m.h)}
    if(m.from!==(isHost?'a':'b')){if(m.d){fx('es','hit');pop('es','-'+F(m.d),'dmg');SFX.hit()}if(m.h){fx('glow');SFX.heal()}}
    if(isHost&&MP.enemy.hp>0){const target=Math.random()<.5?'a':'b';const ed=Math.max(1,Math.round(MP.enemy.damage*R(.85,1.05)));if(target==='a')MP.aHp=Math.max(0,MP.aHp-ed);else MP.bHp=Math.max(0,MP.bHp-ed);send({t:'coopEnemy',target,d:ed});if((target==='a'?MP.aHp:MP.bHp)<=0){send({t:'coopEnd',win:false});mpCoopEnd(false);return}}
    MP.turn=true;mpCoopUpd()
  } else if(m.t==='coopEnemy'){if(m.target==='a')MP.aHp=Math.max(0,MP.aHp-m.d);else MP.bHp=Math.max(0,MP.bHp-m.d);SFX.hit();mpCoopUpd();MP.turn=true} else if(m.t==='coopTurn'){MP.turn=m.turn;mpCoopUpd()} else if(m.t==='coopEnd'){mpCoopEnd(m.win)}
}

function enemyHpSegments(e){
 const max=Math.max(1,Number(e.max)||1),cur=Math.max(0,Math.min(max,Number(e.hp)||0));
 const base=Math.max(0,Math.min(max,Number(e.baseHp)||max));
 const parts=[];
 for(let i=0;i<10;i++){
  const a=max*i/10,b=max*(i+1)/10,span=b-a;
  const filled=Math.max(0,Math.min(cur,b)-a);
  const baseFilled=Math.max(0,Math.min(cur,base,b)-a);
  const extraFilled=Math.max(0,filled-baseFilled);
  const bp=span?Math.max(0,Math.min(100,baseFilled/span*100)):0;
  const ep=span?Math.max(0,Math.min(100,extraFilled/span*100)):0;
  const cls=b<=base?'red':a>=base?'extra':'mixed';
  parts.push(`<span class="hp-seg ${cls}" aria-hidden="true"><i class="hp-base" style="width:${bp}%"></i><i class="hp-extra" style="left:${bp}%;width:${ep}%"></i></span>`);
 }

}

async function enemyTurn(){if(!B||B.over){lock=false;return}const p=eff(),e=B.e;if(e.hp>0){let chance=Math.random(),healChance=.2;if(e.behavior==='regenerator'||e.af==='regenerating')healChance=.55;if((e.behavior==='phase'&&chance<.3)||chance<healChance){const h=Math.min(e.heal,e.max-e.hp);if(h>0){e.hp+=h;evoPopup('👹 +'+F(h),'heal');SFX.heal()}}else{let d=Math.round(e.damage*R(.82,1.04));if((P.evo.unlockedRelics||[]).includes('blood'))d=Math.round(d*1.05);if(B.curse==='Mirror'&&Math.random()<.35){const reflect=Math.round(d*.30);e.hp=Math.max(0,e.hp-reflect);pop('es','↩️ '+F(reflect),'crit');evoPopup('🪞 REFLECT -'+F(reflect),'crit')}if(B.guard)d=Math.round(d*.4);if((P.evo.unlockedRelics||[]).includes('void')&&Math.random()<.10)d=Math.round(d*.3);if(e.af==='enraged')d=Math.round(d*1.25);if(B.phase>=2)d=Math.round(d*(B.phase===2?1.25:1.6));if(e.behavior==='aggressive'&&Math.random()<.25)d=Math.round(d*1.25);B.hp=Math.max(0,B.hp-d);fx('es','ld');await sl(120);fx('ps','hit');pop('ps','-'+F(d),'dmg');evoPopup('👹 -'+F(d),'dmg');if(B.arcaneBurn>0){e.hp=Math.max(0,e.hp-Math.round(d*.15));B.arcaneBurn--}if(e.af==='vampiric')e.hp=Math.min(e.max,e.hp+d*.25)}}B.guard=0;upd();await sl(350);if(B.hp<=0)return end(false);lock=false;save()}
function rewardCurrency(){return B&&B.kind==='r'?'rick':'coins'}
function rewardSnapshot(){
  if(!B)return null;
  const main=Math.max(0,Number(B.e?.reward||0)*Number(P.pr?.r||1));
  const cur=rewardCurrency();
  return {main:Math.round(main),currency:cur,coinBonus:cur==='rick'?Math.round(main*.1):0,fortuneRelic:0,choiceClaimed:false,continued:false};
}
function finishReward(){
  if(!B||!B.reward||B.reward.continued)return;
  B.reward.continued=true;
  const kind=B.kind,d=B.d,w=B.w,back={n:'enemies',r:'rick',raid:'raids'}[kind]||'menu';
  if(kind==='e')return endless(d,(w||1)+1);

  if(kind==='raid'&&P._rush&&P._rushI<P._rush.length-1){P._rushI++;return raid(P._rush[P._rushI]);}
  go(back);
}
function claimReward(type){
  if(!B||!B.reward||B.reward.choiceClaimed)return;
  const rw=B.reward, main=rw.main, cur=rw.currency;
  let title='',detail='',icon='🎁',before='',after='',gain=0;
  if(type==='fortune'){
    gain=Math.max(1,Math.round(main*.5));
    if(cur==='rick'){
      const old=P.rc||0;P.rc=old+gain;before='Rick Coins: '+F(old);after='Rick Coins: '+F(P.rc);
    }else{
      const old=P.coins||0;P.coins=old+gain;before='Coins: '+F(old);after='Coins: '+F(P.coins);
    }
    title='🪙 FORTUNE';detail='Bonus: <b>+'+F(gain)+' '+(cur==='rick'?'Rick Coins':'Coins')+'</b> (50% of the battle reward).';icon='🪙';SFX.buy();evoPopup('🪙 +'+F(gain)+' '+(cur==='rick'?'RICK COINS':'COINS'),'heal');
  }else if(type==='mastery'){
    const amount=5+Math.max(1,Math.floor((B.e.reward||100)/100)),oldXP=Number(P.evo.mastery[P.eq]||0),oldLv=masteryLevel(P.eq);
    masteryXP(P.eq,amount);const newXP=Number(P.evo.mastery[P.eq]||0),newLv=masteryLevel(P.eq);

  }else if(type==='overdrive'){
    const old=Math.round(P.evo.overdrive||0);P.evo.overdrive=100;title='🔥 OVERDRIVE CORE';detail='Overdrive is now <b>100% fully charged</b>!';before='Overdrive: '+old+'%';after='Overdrive: 100%';icon='🔥';SFX.crit();evoPopup('🔥 OVERDRIVE 100%','crit');
  }else if(type==='recovery'){
    const old=P.heal||0,g=Math.max(25,Math.round(old*.25));P.heal=old+g;title='❤️ RECOVERY';detail='You permanently gained <b>+'+F(g)+' Heal Power</b>!';before='Heal Power: '+F(old);after='Heal Power: '+F(P.heal);icon='❤️';SFX.heal();evoPopup('❤️ +'+F(g)+' HEAL POWER','heal');
  }else return;
  rw.choiceClaimed=true;rw.choice=type;save();
  const ar=g('ar'),oldChoice=ar&&ar.querySelector('.reward-choice');if(oldChoice)oldChoice.remove();
  const box=document.createElement('div');box.className='reward-result';
  box.innerHTML='<div class="reward-result-icon">'+icon+'</div><div class="reward-result-label">REWARD RECEIVED</div><h2>'+title+'</h2><p>'+detail+'</p><div class="reward-result-change"><span>'+before+'</span><b>→</b><span>'+after+'</span></div><div class="reward-result-note">✨ This reward was applied once.</div>'+btn('➡️ Continue','finishReward()');
  if(ar)ar.appendChild(box);
}
function rewardChoices(){
  return '<div class="reward-choice"><h2>🎁 CHOOSE ONE BONUS</h2><p class="mu" style="text-align:center">Your battle reward has already been paid. Pick exactly one extra bonus.</p>'+btn('🪙 Fortune',"claimReward('fortune')")+'<small>+50% of the battle reward, in the same main currency.</small>'+btn('⚔️ Mastery',"claimReward('mastery')")+'<small>Gain Weapon Mastery XP.</small>'+btn('🔥 Overdrive Core',"claimReward('overdrive')")+'<small>Fill Overdrive to 100%.</small>'+btn('❤️ Recovery',"claimReward('recovery')")+'<small>Permanently increase Heal Power.</small></div>';

function end(w){
  if(!B||B.over)return;
  B.over=true;lock=false;
  const back={n:'enemies',r:'rick',raid:'raids',e:'endless'}[B.kind]||'menu';
  if(w){
    const base=Math.round(Math.max(0,Number(B.e.reward)||0)*Number(P.pr?.r||1)*(B.mode==='bossrush'?3:1));

    }else P.coins+=main;

    const ov=document.createElement('div');ov.className='ov';

    const sideLine=cur==='rick'?' <br><span class="mu">Bonus: +'+F(B.reward.coinBonus)+' Coins</span>':'';

    setTimeout(()=>{if(g('ar'))g('ar').appendChild(ov)},350);

    const ov=document.createElement('div');ov.className='ov';ov.innerHTML='<h2>💀 DEFEATED</h2><p>Change your build, weapon or strategy.</p>'+btn('🔄 Retry',B.kind==='e'?`endless('${B.d||'Hard'}',${B.w||1})`:`fight('${B.kind==='r'?'r':'n'}',${B.n||1})`)+btn('🏠 Menu',`go('menu')`);setTimeout(()=>{if(g('ar'))g('ar').appendChild(ov)},350);
  }

function endless(d,w=1){const c=D.endless[d],wave=Math.max(1,Number(w)||1);let hp=Math.round(c.hp*Math.pow(c.growth,wave-1)),damage=Math.round(c.damage*Math.pow(c.damageGrowth,wave-1)),reward=Math.round(c.reward*Math.pow(c.rewardGrowth,wave-1));const curse=wave>=5&&wave%5===0?['Blood Oath','Void','Overclock','Mirror'][Math.floor(Math.random()*4)]:null;if(curse==='Blood Oath'||curse==='Overclock')damage*=2;if(curse==='Void')damage=Math.round(damage*1.10);if(curse)reward*=2;mk({name:(D.endlessNames[(wave-1)%D.endlessNames.length]||'Endless Foe')+(curse?' · '+curse:''),hp,damage,heal:Math.round(hp*.05),reward},{kind:'e',d,w:wave,elite:wave%3===0})}
